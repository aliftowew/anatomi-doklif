:root {
  --ground: #f2f6fa;
  --surface: #ffffff;
  --surface-2: #eaf1f7;
  --sidebar: #ffffff;
  --ink: #0e2233;
  --ink-2: #3d5568;
  --muted: #566d80;
  --line: #dde7f0;
  --line-strong: #c3d4e2;
  --accent: #0b77bd;
  --accent-soft: #e3f0fa;
  --accent-ink: #0a6ba9;
  --on-accent: #ffffff;
  --ok: #257534;
  --ok-soft: #ddf3e1;
  --warn: #a8490a;
  --warn-soft: #fdf0d3;
  --crit: #b91c1c;
  --crit-soft: #fde3e0;
  --bayang: 0 1px 3px rgb(14 34 51 / 0.07);
  --bayang-naik: 0 8px 24px rgb(14 34 51 / 0.1);

  /* Warna anatomi. Tulang krem hangat supaya kontras dengan latar biru-abu;
     ligamen memakai aksen (ia "yang sedang dibahas"), otot merah bata redup
     supaya tidak bersaing dengan warna status. */
  --tulang: #f7f2e8;
  --tulang-tepi: #a3957c;
  --tulang-dalam: #e6dcc8;
  --rawan: #d6ebf7;
  --ligamen: #0b77bd;
  --ligamen-soft: #9dcbea;
  --otot: #c2563f;
  --otot-soft: #f1b7ab;
  --saraf: #d9a400;
  --sorot: #0b77bd;
  --bayangan-tubuh: #e4ecf3;

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #071520; --surface: #0f2231; --surface-2: #16303f; --sidebar: #0b1c29;
    --ink: #e6f0f8; --ink-2: #b3c8d8; --muted: #7e9bb0;
    --line: #1e394b; --line-strong: #2b5169;
    --accent: #4aa8e0; --accent-soft: #0e2d40; --accent-ink: #4aa8e0;
    --on-accent: #05131d;
    --ok: #6ede8a; --ok-soft: #0d3320; --warn: #f0c069; --warn-soft: #3a2d12;
    --crit: #f2938c; --crit-soft: #3e1d1b;
    --bayang: 0 1px 3px rgb(0 0 0 / 0.4); --bayang-naik: 0 8px 24px rgb(0 0 0 / 0.5);
    --tulang: #e9e1d2; --tulang-tepi: #8f8470; --tulang-dalam: #cfc4ad; --rawan: #2a4a60;
    --ligamen: #4aa8e0; --ligamen-soft: #2c6a8f; --otot: #d9705a; --otot-soft: #7a3a2d;
    --saraf: #e6c04a; --sorot: #4aa8e0; --bayangan-tubuh: #16303f;
  }
}
:root[data-theme="dark"] {
  --ground: #071520; --surface: #0f2231; --surface-2: #16303f; --sidebar: #0b1c29;
  --ink: #e6f0f8; --ink-2: #b3c8d8; --muted: #7e9bb0;
  --line: #1e394b; --line-strong: #2b5169;
  --accent: #4aa8e0; --accent-soft: #0e2d40; --accent-ink: #4aa8e0;
  --on-accent: #05131d;
  --ok: #6ede8a; --ok-soft: #0d3320; --warn: #f0c069; --warn-soft: #3a2d12;
  --crit: #f2938c; --crit-soft: #3e1d1b;
  --bayang: 0 1px 3px rgb(0 0 0 / 0.4); --bayang-naik: 0 8px 24px rgb(0 0 0 / 0.5);
  --tulang: #e9e1d2; --tulang-tepi: #8f8470; --tulang-dalam: #cfc4ad; --rawan: #2a4a60;
  --ligamen: #4aa8e0; --ligamen-soft: #2c6a8f; --otot: #d9705a; --otot-soft: #7a3a2d;
  --saraf: #e6c04a; --sorot: #4aa8e0; --bayangan-tubuh: #16303f;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
.tnum { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main:focus { outline: none; }

.ikon { width: 1em; height: 1em; display: inline-block; vertical-align: middle; flex: none; }
.ikon svg { width: 100%; height: 100%; display: block; }

/* ---------- Kerangka halaman ---------- */
.app {
  height: 100dvh;
  display: grid;
  grid-template-columns: 16rem minmax(0, 1fr);
  transition: grid-template-columns 200ms ease;
}
.app.menu-sembunyi { grid-template-columns: 0 minmax(0, 1fr); }

.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  width: 16rem;
}
.app.menu-sembunyi .sidebar { visibility: hidden; }
.sidebar-isi { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }
.merek { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.5rem 0.25rem; }
.merek-marka {
  width: 2.5rem; height: 2.5rem; border-radius: 0.75rem;
  background: var(--accent-soft); color: var(--accent-ink);
  display: grid; place-items: center; font-size: 1.35rem; flex: none;
}
.merek-nama { font-size: 1.02rem; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
.merek-sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.15rem; }

.nav { display: flex; flex-direction: column; gap: 0.7rem; }
.nav-grup { display: flex; flex-direction: column; gap: 0.1rem; }
.nav-label { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); padding: 0 0.75rem; margin-bottom: 0.2rem; }
.nav-butir {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.32rem 0.7rem; border-radius: 0.75rem;
  font-size: 0.84rem; font-weight: 500; color: var(--ink-2); white-space: nowrap;
  text-decoration: none; border: 0; background: none; text-align: left; width: 100%;
  transition: background-color 120ms;
}
.nav-butir .ikon { font-size: 1.15rem; color: var(--muted); }
.nav-butir:hover { background: var(--surface-2); }
.nav-butir.aktif { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nav-butir.aktif .ikon { color: var(--accent-ink); }
.nav-nomor { margin-left: auto; font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); }

.sidebar-kaki { border-top: 1px solid var(--line); padding: 0.75rem; display: flex; flex-direction: column; gap: 0.6rem; }
.chip-sesi { display: flex; align-items: center; gap: 0.5rem; background: var(--surface-2); border-radius: 0.75rem; padding: 0.5rem 0.65rem; }
.chip-sesi .ikon { font-size: 1.1rem; color: var(--muted); }
.chip-sesi-eyebrow { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.chip-sesi-nama { font-size: 0.76rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pintasan { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; font-size: 0.68rem; color: var(--muted); }
kbd {
  font-family: var(--font-mono); font-size: 0.62rem;
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 0.35rem;
  padding: 0 0.3rem; background: var(--surface); color: var(--ink-2);
}

.kanan { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar-atas {
  display: flex; align-items: center; gap: 0.75rem;
  border-bottom: 1px solid var(--line); background: var(--surface);
  padding: 0.6rem 1.5rem;
}
.bar-atas .judul { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.kicker { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
.bar-atas h1 { margin: 0; font-size: 1.45rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-aksi { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
.hitung-adegan { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); padding: 0 0.5rem; }

.tombol-ikon {
  display: grid; place-items: center; width: 2.5rem; height: 2.5rem;
  border-radius: 0.75rem; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink-2); font-size: 1.15rem; transition: background-color 120ms;
}
.tombol-ikon:hover { background: var(--surface-2); }
.ikon-terang { display: none; } .ikon-gelap { display: inline-block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .ikon-terang { display: inline-block; }
  :root:not([data-theme="light"]) .ikon-gelap { display: none; }
}
:root[data-theme="dark"] .ikon-terang { display: inline-block; }
:root[data-theme="dark"] .ikon-gelap { display: none; }
:root[data-theme="light"] .ikon-terang { display: none; }
:root[data-theme="light"] .ikon-gelap { display: inline-block; }

main { flex: 1; min-height: 0; padding: 1.25rem 1.5rem 1.25rem; display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 1rem; }
main.tanpa-panel { grid-template-columns: minmax(0, 1fr); }

/* ---------- Panggung ---------- */
.panggung {
  position: relative;
  border-radius: 1rem; border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--bayang); min-height: 0; overflow: hidden;
  display: flex; flex-direction: column;
}
.panggung-isi { flex: 1; min-height: 0; position: relative; }
.panggung-isi > svg { width: 100%; height: 100%; display: block; }
.panggung-kaki {
  display: flex; align-items: center; gap: 0.75rem;
  border-top: 1px solid var(--line); padding: 0.6rem 1.1rem;
  font-size: 0.86rem; color: var(--ink-2); min-height: 2.9rem;
}
.panggung-kaki .lencana { margin-left: auto; }
.catatan-adegan { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.penanda-tampak {
  position: absolute; top: 0.9rem; left: 0.9rem; z-index: 2;
  display: inline-flex; gap: 0.25rem; padding: 0.25rem; border-radius: 0.75rem;
  background: var(--surface-2); border: 1px solid var(--line);
}
.penanda-tampak button {
  border: 0; background: none; border-radius: 0.55rem; padding: 0.3rem 0.8rem;
  font-size: 0.8rem; font-weight: 500; color: var(--ink-2);
}
.penanda-tampak button.aktif { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--bayang); }
.sudut-besar {
  position: absolute; top: 0.9rem; right: 0.9rem; z-index: 2;
  display: flex; flex-direction: column; align-items: flex-end; gap: 0.1rem;
  padding: 0.55rem 0.9rem; border-radius: 0.9rem; background: var(--surface);
  border: 1px solid var(--line); box-shadow: var(--bayang);
}
.sudut-besar .nilai { font-size: 2.1rem; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
.sudut-besar .nilai.awas { color: var(--warn); }
.sudut-besar .label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.lencana {
  display: inline-flex; align-items: center; gap: 0.3rem;
  border-radius: 999px; padding: 0.22rem 0.65rem; font-size: 0.72rem; font-weight: 600; white-space: nowrap;
}
.lencana .ikon { font-size: 0.95rem; }
.lencana.aksen { background: var(--accent-soft); color: var(--accent-ink); }
.lencana.netral { background: var(--surface-2); color: var(--muted); }
.lencana.baik { background: var(--ok-soft); color: var(--ok); }
.lencana.awas { background: var(--warn-soft); color: var(--warn); }
.lencana.buruk { background: var(--crit-soft); color: var(--crit); }

/* ---------- Panel kendali ---------- */
.panel { display: flex; flex-direction: column; gap: 0.85rem; min-height: 0; overflow-y: auto; padding-right: 0.1rem; }
.kartu {
  border-radius: 1rem; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--bayang);
  padding: 0.95rem 1rem; display: flex; flex-direction: column; gap: 0.7rem;
}
.kartu h2 { margin: 0; font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.5rem; }
.kartu h2 .ikon { color: var(--muted); font-size: 1.05rem; }
.eyebrow { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.geser { display: flex; flex-direction: column; gap: 0.3rem; }
.geser-kepala { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
.geser-nama { font-size: 0.86rem; font-weight: 600; color: var(--ink); }
.geser-nilai { font-family: var(--font-mono); font-size: 0.86rem; font-weight: 500; color: var(--accent-ink); }
.geser-nilai.awas { color: var(--warn); }
.geser-rel { position: relative; height: 1.5rem; display: flex; align-items: center; }
.geser-normal { position: absolute; left: 0; right: 0; height: 0.5rem; border-radius: 999px; background: var(--surface-2); }
.geser-normal::after { content: ""; position: absolute; inset: 0; border-radius: 999px; background: var(--accent-soft); left: var(--a, 0%); right: var(--b, 0%); }
.geser-normal .batas { position: absolute; top: -0.2rem; bottom: -0.2rem; width: 2px; background: var(--line-strong); }
input[type="range"].geser-input {
  position: relative; width: 100%; margin: 0; background: none; -webkit-appearance: none; appearance: none; height: 1.5rem;
}
input[type="range"].geser-input::-webkit-slider-runnable-track { height: 0.5rem; background: transparent; }
input[type="range"].geser-input::-webkit-slider-thumb {
  -webkit-appearance: none; width: 1.25rem; height: 1.25rem; margin-top: -0.375rem; border-radius: 999px;
  background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong), var(--bayang);
}
input[type="range"].geser-input::-moz-range-track { height: 0.5rem; background: transparent; }
input[type="range"].geser-input::-moz-range-thumb {
  width: 1.1rem; height: 1.1rem; border-radius: 999px; background: var(--accent); border: 3px solid var(--surface);
  box-shadow: 0 0 0 1px var(--line-strong);
}
.geser-kaki { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); }

.baris-tombol { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tombol {
  display: inline-flex; align-items: center; gap: 0.5rem; height: 2.4rem; padding: 0 0.95rem;
  border-radius: 0.75rem; font-size: 0.86rem; font-weight: 600; border: 1px solid transparent;
  transition: opacity 120ms, background-color 120ms;
}
.tombol .ikon { font-size: 1.05rem; }
.tombol.utama { background: var(--accent); color: var(--on-accent); box-shadow: var(--bayang); }
.tombol.utama:hover { opacity: 0.9; }
.tombol.garis { border-color: var(--line); background: var(--surface); color: var(--ink-2); }
.tombol.garis:hover { background: var(--surface-2); }
.tombol.garis.aktif { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.tombol:disabled { opacity: 0.5; cursor: default; }

.pemindah { display: inline-flex; flex-wrap: wrap; gap: 0.25rem; border-radius: 1rem; border: 1px solid var(--line); background: var(--surface-2); padding: 0.25rem; }
.pemindah button {
  display: inline-flex; align-items: center; gap: 0.4rem; border: 0; background: none;
  border-radius: 0.75rem; padding: 0.4rem 0.85rem; font-size: 0.84rem; font-weight: 500; color: var(--ink-2);
}
.pemindah button .ikon { font-size: 1rem; }
.pemindah button.aktif { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--bayang); }
.pemindah kbd { margin-left: 0.2rem; }

.chip-baris { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.35rem; border-radius: 999px; padding: 0.3rem 0.75rem;
  font-size: 0.8rem; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.chip:hover { background: var(--surface-2); }
.chip.aktif { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.chip .titik { width: 0.6rem; height: 0.6rem; border-radius: 999px; background: var(--ligamen); }
.chip.otot .titik { background: var(--otot); }

.keterangan { font-size: 0.8rem; color: var(--ink-2); margin: 0; }
.keterangan b { color: var(--ink); }
.daftar-fakta { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
.daftar-fakta li { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.82rem; color: var(--ink-2); }
.daftar-fakta li .ikon { color: var(--accent-ink); font-size: 0.95rem; flex: none; position: relative; top: 0.1rem; }
.daftar-fakta .saraf { margin-left: auto; font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); white-space: nowrap; }

.catatan-kartu {
  display: flex; gap: 0.6rem; border-radius: 1rem 1rem 1rem 0.5rem; border: 1px solid var(--line);
  border-left: 4px solid var(--accent); background: var(--surface); padding: 0.7rem 0.85rem; font-size: 0.8rem; color: var(--ink-2);
}
.catatan-kartu .ikon { color: var(--accent-ink); font-size: 1.05rem; flex: none; margin-top: 0.1rem; }

/* ---------- Gambar anatomi ---------- */
.tulang { fill: var(--tulang); stroke: var(--tulang-tepi); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.tulang-garis { fill: none; stroke: var(--tulang-tepi); stroke-width: 1.6; stroke-linecap: round; opacity: 0.7; }
.tulang-dalam { fill: var(--tulang-dalam); stroke: none; opacity: 0.9; }
.rawan { fill: var(--rawan); stroke: none; }
.bayangan-tubuh { fill: var(--bayangan-tubuh); stroke: none; }
.lantai { stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 6 6; }
g.bone { cursor: pointer; transition: transform 500ms cubic-bezier(.2,.8,.2,1); }
g.bone:hover .tulang, g.bone.sorot .tulang { stroke: var(--sorot); stroke-width: 3.2; fill: var(--accent-soft); }
g.bone.redup { opacity: 0.35; }
.sendi-titik { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
.sendi-garis { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; opacity: 0.8; }
.busur { fill: none; stroke: var(--accent); stroke-width: 2; }
.busur-normal { fill: var(--accent-soft); opacity: 0.55; }
.ligamen { fill: var(--ligamen); stroke: var(--surface); stroke-width: 1; opacity: 0.92; cursor: pointer; }
.ligamen.redup { opacity: 0.35; }
.ligamen.sorot { fill: var(--warn); }
.ligamen.meniskus { fill: var(--ligamen-soft); }
.ligamen.meniskus.sorot { fill: var(--warn); }
.otot { fill: var(--otot); stroke: var(--surface); stroke-width: 1; opacity: 0.85; cursor: pointer; }
.otot.redup { opacity: 0.3; }
.otot.sorot { fill: var(--warn); }
.tendon { opacity: 0.7; }
.ligamen.tegang { fill: var(--warn); }
svg.lapisan-aktif g.bone .tulang { opacity: 0.75; }
.label-pil rect { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; filter: drop-shadow(0 2px 4px rgb(14 34 51 / 0.12)); }
.label-pil text { font-family: var(--font-sans); font-size: 16px; font-weight: 600; fill: var(--ink); }
.label-pil .sub { font-size: 13px; font-weight: 400; fill: var(--muted); }
.label-pil line { stroke: var(--line-strong); stroke-width: 1.5; }
.teks-adegan { font-family: var(--font-sans); fill: var(--muted); font-size: 13px; }
.teks-mono { font-family: var(--font-mono); fill: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.teks-sudut { font-family: var(--font-sans); fill: var(--accent-ink); font-size: 15px; font-weight: 700; }

/* ---------- Tes klinis: figur pasien & anotasi ---------- */
.figur-tulang { stroke: var(--tulang-tepi); stroke-linecap: round; fill: none; }
.figur-tulang.aksen { stroke: var(--accent); }
.figur-badan { stroke: var(--tulang-dalam); stroke-linecap: round; fill: none; }
.figur-kepala { fill: var(--tulang); stroke: var(--tulang-tepi); stroke-width: 3; }
.figur-sendi { fill: var(--surface); stroke: var(--tulang-tepi); stroke-width: 3; }
.figur-dekat .figur-sendi { stroke: var(--accent-ink); }
.figur-patella { fill: var(--surface); stroke: var(--accent-ink); stroke-width: 3; }
.figur-jauh { opacity: 0.4; }
.meja { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 2; }
.meja-kaki { fill: var(--line-strong); }
.anot-panah { stroke: var(--accent); stroke-width: 5; fill: none; stroke-linecap: round; }
.anot-tangan rect, .anot-tangan circle { fill: var(--surface); stroke: var(--accent-ink); stroke-width: 2.5; }
.anot-nyeri circle { fill: var(--warn); stroke: none; }
.anot-klik circle { fill: var(--accent); stroke: none; }
.anot-nyeri .denyut, .anot-klik .denyut { opacity: 0.25; transform-origin: center; animation: denyut 1.4s ease-out infinite; }
.anot-nyeri .denyut.lambat, .anot-klik .denyut.lambat { opacity: 0.45; animation-delay: 0.4s; }
@keyframes denyut { 0% { transform: scale(0.5); opacity: 0.6; } 100% { transform: scale(1.25); opacity: 0; } }
.anot-ukur { stroke: var(--ink-2); stroke-width: 2.5; stroke-dasharray: 8 6; }
.anot-titik { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
.anot-pil rect { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; filter: drop-shadow(0 2px 4px rgb(14 34 51 / 0.12)); }
.anot-pil text { font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); }
.anot-pil.awas rect { stroke: var(--warn); } .anot-pil.awas text { fill: var(--warn); }
.anot-pil.aksen rect { stroke: var(--accent); } .anot-pil.aksen text { fill: var(--accent-ink); }
.anot-pil.ukur text { font-family: var(--font-mono); font-weight: 500; }
.anot-pil.tangan text { fill: var(--ink-2); font-weight: 500; }
.judul-tes { position: absolute; top: 0.9rem; left: 0.9rem; z-index: 2; display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0.8rem; border-radius: 0.9rem; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--bayang); }
.judul-tes .nama { font-weight: 800; letter-spacing: -0.01em; font-size: 1rem; }
.langkah { margin: 0.4rem 0 0.6rem; padding-left: 1.2rem; font-size: 0.84rem; color: var(--ink-2); display: flex; flex-direction: column; gap: 0.3rem; }
@media (prefers-reduced-motion: reduce) { .anot-nyeri .denyut, .anot-klik .denyut { animation: none; } }

/* ---------- Kompartemen ---------- */
.kulit { fill: var(--bayangan-tubuh); stroke: var(--line-strong); stroke-width: 2; }
.kompartemen { fill: var(--lunak); stroke: var(--warna); stroke-width: 2; cursor: pointer; transition: opacity 150ms; }
.kompartemen:hover, .kompartemen.aktif { fill: var(--warna); fill-opacity: 0.35; stroke-width: 3.5; }
.kompartemen.redup { opacity: 0.35; }
.membran { stroke: var(--tulang-tepi); stroke-width: 3; stroke-dasharray: 6 4; }
.label-tulang { font-family: var(--font-sans); font-size: 15px; font-weight: 700; fill: var(--ink-2); }
.label-kompartemen { font-family: var(--font-sans); font-size: 18px; font-weight: 800; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 6px; stroke-linejoin: round; }

/* ---------- Beranda ---------- */
.beranda { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 1.5rem; align-self: start; max-width: 72rem; }
.beranda h1 { margin: 0; font-size: 2.4rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; }
.beranda .keterangan-besar { color: var(--ink-2); max-width: 64ch; margin: 0.4rem 0 0; }
.grid-modul { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.kartu-modul { display: flex; flex-direction: column; gap: 0.8rem; padding: 1.2rem; text-align: left; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); box-shadow: var(--bayang); cursor: pointer; transition: box-shadow 150ms, transform 150ms; }
.kartu-modul:hover { box-shadow: var(--bayang-naik); transform: translateY(-2px); }
.kartu-modul .kotak-ikon { width: 2.75rem; height: 2.75rem; border-radius: 0.75rem; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-size: 1.35rem; }
.kartu-modul h2 { margin: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: -0.015em; }
.kartu-modul p { margin: 0; font-size: 0.86rem; color: var(--ink-2); }
.kartu-modul .adegan-jumlah { margin-top: auto; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.statistik-baris { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
.statistik { display: flex; flex-direction: column; gap: 0.5rem; padding: 1rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); box-shadow: var(--bayang); }
.statistik .kotak-ikon { width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; display: grid; place-items: center; font-size: 1.2rem; background: var(--accent-soft); color: var(--accent-ink); }
.statistik .nilai { font-size: 1.7rem; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
.statistik .label { font-size: 0.86rem; font-weight: 500; color: var(--ink-2); }
.statistik .sub { font-size: 0.74rem; color: var(--muted); }

/* ---------- Gait ---------- */
.fase-bar { display: flex; height: 2.4rem; border-radius: 0.75rem; overflow: hidden; border: 1px solid var(--line); }
.fase-bar > div { display: grid; place-items: center; font-size: 0.68rem; font-weight: 600; color: var(--ink-2); border-right: 1px solid var(--surface); white-space: nowrap; overflow: hidden; }
.fase-bar .stance { background: var(--accent-soft); color: var(--accent-ink); }
.fase-bar .swing { background: var(--surface-2); }
.fase-bar .aktif { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent); color: var(--on-accent); }
.transport { display: flex; align-items: center; gap: 0.5rem; }
.transport .persen { margin-left: auto; font-family: var(--font-mono); font-size: 1.4rem; font-weight: 500; color: var(--accent-ink); }

/* ---------- Tumbuh kembang ---------- */
.usia-cepat { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.domain { display: flex; flex-direction: column; gap: 0.3rem; }
.domain-kepala { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; font-weight: 700; }
.domain-kepala .titik { width: 0.65rem; height: 0.65rem; border-radius: 999px; }
.domain-isi { font-size: 0.84rem; color: var(--ink-2); padding-left: 1.15rem; }

@media (prefers-reduced-motion: reduce) {
  g.bone, .app { transition: none; }
}
.saat-penuh { display: none; }
.app.layar-penuh .saat-penuh { display: inline; }
.app.layar-penuh .saat-normal { display: none; }
.tirai { position: fixed; inset: 0; z-index: 30; background: rgb(14 34 51 / 0.4); border: 0; }
.dialog-bantuan { margin: auto; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); color: var(--ink); padding: 0; box-shadow: var(--bayang-naik); width: min(30rem, calc(100vw - 2rem)); }
.dialog-bantuan::backdrop { background: rgb(14 34 51 / 0.5); }
.dialog-isi { display: flex; flex-direction: column; gap: 0.8rem; padding: 1.25rem 1.4rem; }
.dialog-isi h2 { margin: 0; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
.tabel-pintasan { border-collapse: collapse; font-size: 0.86rem; }
.tabel-pintasan td { padding: 0.35rem 0.6rem 0.35rem 0; border-top: 1px solid var(--line); color: var(--ink-2); }
.tabel-pintasan td:first-child { white-space: nowrap; width: 7rem; }
@media (max-width: 1100px) {
  .app, .app.menu-sembunyi { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; width: 17rem; max-width: 85vw; box-shadow: var(--bayang-naik); transform: translateX(-100%); visibility: hidden; transition: transform 200ms ease, visibility 200ms; }
  .app.laci-terbuka .sidebar { transform: none; visibility: visible; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; padding: 0.75rem; }
  .panel { flex-direction: row; overflow-x: auto; max-height: 16rem; }
  .panel .kartu { min-width: 18rem; }
}
