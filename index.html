:root {
  --ground: #f2f6fa;
  --surface: #ffffff;
  --surface-2: #eaf1f7;
  --sidebar: #ffffff;
  --ink: #0e2233;
  --ink-2: #3d5568;
  --muted: #566d80;
  --line: #dde7f0;
  --line-strong: #c3d4e2;
  --accent: #0b77bd;
  --accent-soft: #e3f0fa;
  --accent-ink: #0a6ba9;
  --on-accent: #ffffff;
  --ok: #257534;
  --ok-soft: #ddf3e1;
  --warn: #a8490a;
  --warn-soft: #fdf0d3;
  --crit: #b91c1c;
  --crit-soft: #fde3e0;
  --bayang: 0 1px 3px rgb(14 34 51 / 0.07);
  --bayang-naik: 0 8px 24px rgb(14 34 51 / 0.1);

  /* Warna anatomi. Tulang krem hangat supaya kontras dengan latar biru-abu;
     ligamen memakai aksen (ia "yang sedang dibahas"), otot merah bata redup
     supaya tidak bersaing dengan warna status. */
  --tulang: #f7f2e8;
  --tulang-tepi: #a3957c;
  --tulang-dalam: #e6dcc8;
  --rawan: #d6ebf7;
  --ligamen: #0b77bd;
  --ligamen-soft: #9dcbea;
  --otot: #c2563f;
  --otot-soft: #f1b7ab;
  --saraf: #d9a400;
  --sorot: #0b77bd;
  --bayangan-tubuh: #e4ecf3;

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #071520; --surface: #0f2231; --surface-2: #16303f; --sidebar: #0b1c29;
    --ink: #e6f0f8; --ink-2: #b3c8d8; --muted: #7e9bb0;
    --line: #1e394b; --line-strong: #2b5169;
    --accent: #4aa8e0; --accent-soft: #0e2d40; --accent-ink: #4aa8e0;
    --on-accent: #05131d;
    --ok: #6ede8a; --ok-soft: #0d3320; --warn: #f0c069; --warn-soft: #3a2d12;
    --crit: #f2938c; --crit-soft: #3e1d1b;
    --bayang: 0 1px 3px rgb(0 0 0 / 0.4); --bayang-naik: 0 8px 24px rgb(0 0 0 / 0.5);
    --tulang: #e9e1d2; --tulang-tepi: #8f8470; --tulang-dalam: #cfc4ad; --rawan: #2a4a60;
    --ligamen: #4aa8e0; --ligamen-soft: #2c6a8f; --otot: #d9705a; --otot-soft: #7a3a2d;
    --saraf: #e6c04a; --sorot: #4aa8e0; --bayangan-tubuh: #16303f;
  }
}
:root[data-theme="dark"] {
  --ground: #071520; --surface: #0f2231; --surface-2: #16303f; --sidebar: #0b1c29;
  --ink: #e6f0f8; --ink-2: #b3c8d8; --muted: #7e9bb0;
  --line: #1e394b; --line-strong: #2b5169;
  --accent: #4aa8e0; --accent-soft: #0e2d40; --accent-ink: #4aa8e0;
  --on-accent: #05131d;
  --ok: #6ede8a; --ok-soft: #0d3320; --warn: #f0c069; --warn-soft: #3a2d12;
  --crit: #f2938c; --crit-soft: #3e1d1b;
  --bayang: 0 1px 3px rgb(0 0 0 / 0.4); --bayang-naik: 0 8px 24px rgb(0 0 0 / 0.5);
  --tulang: #e9e1d2; --tulang-tepi: #8f8470; --tulang-dalam: #cfc4ad; --rawan: #2a4a60;
  --ligamen: #4aa8e0; --ligamen-soft: #2c6a8f; --otot: #d9705a; --otot-soft: #7a3a2d;
  --saraf: #e6c04a; --sorot: #4aa8e0; --bayangan-tubuh: #16303f;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
.tnum { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main:focus { outline: none; }

.ikon { width: 1em; height: 1em; display: inline-block; vertical-align: middle; flex: none; }
.ikon svg { width: 100%; height: 100%; display: block; }

/* ---------- Kerangka halaman ---------- */
.app {
  height: 100dvh;
  display: grid;
  grid-template-columns: 16rem minmax(0, 1fr);
  transition: grid-template-columns 200ms ease;
}
.app.menu-sembunyi { grid-template-columns: 0 minmax(0, 1fr); }

.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  width: 16rem;
}
.app.menu-sembunyi .sidebar { visibility: hidden; }
.sidebar-isi { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }
.merek { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.5rem 0.25rem; }
.merek-marka {
  width: 2.5rem; height: 2.5rem; border-radius: 0.75rem;
  background: var(--accent-soft); color: var(--accent-ink);
  display: grid; place-items: center; font-size: 1.35rem; flex: none;
}
.merek-nama { font-size: 1.02rem; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
.merek-sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.15rem; }

.nav { display: flex; flex-direction: column; gap: 0.7rem; }
